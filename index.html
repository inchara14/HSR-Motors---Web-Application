<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LeadDrive – Wireframe Navigation</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #e0ecff, #f7faff);
            padding: 60px;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            max-width: 420px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .nav-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
        }

        a {
            display: block;
            padding: 14px;
            margin: 14px 0;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        /* Button colors */
        .dashboard {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        .lead-listing {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }

        .lead-details {
            background: linear-gradient(135deg, #ff8008, #ffc837);
        }

        .lead-management {
            background: linear-gradient(135deg, #eb3349, #f45c43);
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>DriveFlow</h1>
    <p>Wireframe Navigation Panel</p>

    <div class="nav-container">
        <a class="dashboard" href="dashboard_screen/code.html">
            📊 Dashboard Screen
        </a>

        <a class="lead-listing" href="lead_listing_screen/code.html">
            📋 Lead Listing Screen
        </a>

        <a class="lead-details" href="lead_details_screen/code.html">
            👤 Lead Details Screen
        </a>

        <a class="lead-management" href="lead_management_screen/code.html">
            🔄 Lead Management Screen
        </a>
    </div>

    <footer>
        Internal Product Wireframes • Desktop View
    </footer>
</div>

</body>
</html>
